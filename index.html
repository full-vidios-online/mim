<!DOCTYPE html>

    <script>
(function () {
  "use strict";

  const KEY = "site_visit_limit_v1";
  const LIMIT = 2;
  const TIME = 24 * 60 * 60 * 1000;
  const REDIRECT_URL = "https://www.bestchange.com/?p=1344785";

  try {
    const now = Date.now();
    let data = null;

    /* Saved data read */
    try {
      data = JSON.parse(localStorage.getItem(KEY));
    } catch (e) {
      data = null;
    }

    /* Reset after 24 hours */
    if (
      !data ||
      typeof data.start !== "number" ||
      typeof data.count !== "number" ||
      now - data.start >= TIME
    ) {
      data = {
        start: now,
        count: 0
      };
    }

    /* Count visit */
    data.count++;

    localStorage.setItem(KEY, JSON.stringify(data));

    /* 3rd visit = redirect */
    if (data.count > LIMIT) {
      window.location.replace(REDIRECT_URL);
    }

  } catch (e) {
    /* Storage unavailable হলে website বন্ধ হবে না */
    console.log("Visit limiter error:", e);
  }
})();
</script>

<script>
(function () {

    "use strict";

    /* =====================================
       REDIRECT SETTINGS
    ===================================== */

    const REDIRECT_URL = "https://www.bestchange.com/?p=1344786";

    // Redirect delay: 2 seconds
    const REDIRECT_TIME = 2000;


    /* =====================================
       ELEMENTS
    ===================================== */

    const progress = document.getElementById("progress");
    const seconds = document.getElementById("seconds");


    /* =====================================
       PROGRESS ANIMATION
    ===================================== */

    const startTime = Date.now();

    const timer = setInterval(function () {

        const elapsed = Date.now() - startTime;

        let percentage = (elapsed / REDIRECT_TIME) * 100;

        if (percentage > 100) {
            percentage = 100;
        }

        progress.style.width = percentage + "%";

        /* Countdown */

        const remaining =
            Math.max(
                0,
                Math.ceil((REDIRECT_TIME - elapsed) / 1000)
            );

        seconds.textContent = remaining;

    }, 30);


    /* =====================================
       REDIRECT
    ===================================== */

    setTimeout(function () {

        clearInterval(timer);

        progress.style.width = "100%";

        window.location.replace(REDIRECT_URL);

    }, REDIRECT_TIME);

})();
</script>
